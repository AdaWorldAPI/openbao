name: Docs CI
# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Check Absolute Links
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find absolute links
        run: |
          echo "Checking for absolute links in website/content/docs/..."
          grep -rn -P "(\(|: |openbao.org)/docs/[^)]+" website/content/docs > grep_output.txt || true

          # Check if any absolute links were found
          if [ -s grep_output.txt ]; then
            echo "::error::Found absolute links that should be relative. See annotations for details."
            jq -rRs 'split("\n")[:-1][]| split(":") | "::error file=\(.[0]),line=\(.[1]),title=Absolute Link found::\(.[2:]| join(":"))"' grep_output.txt
            exit 1
          fi
  test-docs:
    name: Test Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml
      - id: build-docs
        name: build-docs
        working-directory: ./website
        run: |
          make build-versioned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/build/

  lint-docs:
    name: Lint Docs
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml
      - id: lint-docs
        name: lint-docs
        working-directory: ./website
        run: |
          make lint
