name: Ensure Verified Commits

# Manual-only: GitHub-hosted runner minutes are capped (the account's
# included minutes are used up), so this workflow no longer starts on push,
# pull_request or a schedule. Run it from the Actions tab when needed, and run
# the same checks locally before pushing.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify_commits:
    name: Verify Commit Signatures
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check commit signatures
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits | \
          jq '[
              # Iterate over all commits
              .[] |
              # select maintainer commits
              select(
               .author.login == "JanMa" or
               .author.login == "cipherboy" or
               .author.login == "DanGhita" or
               .author.login == "naphelps" or
               .author.login == "DrDaveD"
              ) |
              # select any unsigned commits
              select(.commit.verification.verified == false)
             ] |
             # check if there are unsigned commits
             if (. | length) != 0 then
              # return error
              ("PR contains unsigned maintainer commits!\n" | halt_error(1))
             else
              # return success
              "All maintainer commits are signed"
             end'
        env:
          GH_TOKEN: ${{ github.token }}
